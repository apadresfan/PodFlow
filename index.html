<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171426"><title>PodFlow</title><link rel="manifest" href="manifest.json"><link rel="icon" type="image/png" href="podflow-icon.png"><link rel="apple-touch-icon" sizes="180x180" href="podflow-icon.png"><style>
:root{color-scheme:dark;--bg:#141120;--panel:#211d30;--muted:#aaa3bd;--accent:#ba8aff;--line:#383047}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#faf8ff;font:15px system-ui,sans-serif}button,input,select{font:inherit}button,select,input{border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:var(--panel);color:inherit}button{cursor:pointer}button:hover,button:focus-visible{border-color:var(--accent)}button.primary{background:#bd8cff;color:#1a102b;font-weight:750;border:0}button.small{padding:7px 10px;font-size:13px}button:disabled{opacity:.4}a{color:#c9a6ff}h1,h2,h3,p{margin:0}p{line-height:1.5}small,.muted{color:var(--muted)}.shell{display:grid;grid-template-columns:225px minmax(0,1fr) 310px;min-height:100vh;padding-bottom:125px}.sidebar,.right{padding:22px;border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);border-right:0}.brand{font-size:28px;font-weight:850;letter-spacing:-1.5px}.brand b{color:#d2a0ff}.nav{display:grid;gap:8px;margin:30px 0}.nav button{text-align:left;background:none;border-color:transparent}.nav button.active{background:#39294f;color:#e0c5ff}.main{padding:30px;min-width:0}.hero{border-radius:24px;padding:26px;background:linear-gradient(120deg,#6338af,#bb477e 65%,#b76b35);margin:22px 0;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:10px}.hero h2{font-size:30px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.toolbar input{flex:1;min-width:160px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:14px}.card{background:var(--panel);padding:12px;border-radius:16px;min-width:0}.art{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:linear-gradient(135deg,#7d4bd0,#f18186);display:grid;place-items:center;font-size:40px}.card h3{font-size:15px;margin:10px 0 5px;overflow-wrap:anywhere}.card button{margin-top:9px;width:100%}.episode{display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}.episode .art{width:52px;flex:none;font-size:23px}.episode .info{flex:1;min-width:0}.episode h3{font-size:15px;overflow-wrap:anywhere}.actions{display:flex;gap:5px;flex-wrap:wrap}.section{margin:24px 0}.section h2{margin-bottom:12px}.player{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#211b32f5;backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:12px 22px;display:grid;grid-template-columns:minmax(140px,1fr) minmax(260px,2fr) minmax(150px,1fr);gap:18px;align-items:center}.player .art{width:54px;font-size:25px}.now{display:flex;align-items:center;gap:10px;min-width:0}.now h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;align-items:center;justify-content:center;gap:10px}.play{border-radius:50%;width:48px;height:48px;padding:0;font-size:20px}.timeline{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--muted)}input[type=range]{accent-color:var(--accent);padding:0;width:100%;min-width:0}.settings{display:grid;gap:12px}.setting{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.setting input[type=number]{width:90px}.notice{padding:12px;border-radius:12px;background:#332644;color:#e1c9ff;margin:12px 0}.empty{padding:25px 0;color:var(--muted)}dialog{background:var(--panel);color:inherit;border:1px solid var(--line);border-radius:20px;padding:24px;width:min(650px,94vw);max-height:85vh;overflow:auto}dialog::backdrop{background:#0009}.close{float:right}.driving .shell{display:none}.drive{display:none}.driving .drive{display:grid;min-height:80vh;place-content:center;text-align:center;gap:24px;padding:20px}.drive button{font-size:26px;padding:24px}.drive .controls{flex-wrap:wrap}.chapter{display:block;width:100%;text-align:left;margin:5px 0}.transcript{white-space:pre-wrap;line-height:1.6;max-height:350px;overflow:auto}.transcript button{display:block;text-align:left;width:100%;margin:4px 0}.queueitem{margin:12px 0;padding:12px;background:var(--panel);border-radius:12px}.queueitem h3{font-size:14px;margin-bottom:8px}.queueitem .actions button{padding:5px 9px}.status{min-height:24px;color:#d5b8ff;font-size:13px}.pill{font-size:12px;color:#e1c5ff;background:#3a2855;border-radius:99px;padding:5px 10px}.logo{font-size:23px}.mobilequeue{display:none}@media(max-width:1100px){.shell{grid-template-columns:185px minmax(0,1fr)}.right{display:none}.mobilequeue{display:inline-block}}@media(max-width:700px){.shell{display:block;padding-bottom:170px}.sidebar{padding:14px;border:0}.nav{display:flex;overflow-x:auto;margin:12px 0 0;gap:4px}.nav button{white-space:nowrap;padding:9px}.sidebar>small,.sidebar>.notice{display:none}.main{padding:14px}.hero{margin:14px 0;padding:20px}.hero h2{font-size:25px}.player{grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px env(safe-area-inset-bottom,10px)}.player .middle{grid-column:1/-1;grid-row:2}.player .extras{justify-content:flex-end}.episode{flex-wrap:wrap}.episode .actions{margin-left:64px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.right{display:none}}

.full-player{display:none;position:fixed;inset:0;z-index:20;overflow:auto;overscroll-behavior:contain;background:radial-gradient(ellipse at 50% 20%,#673b8c 0%,#342247 40%,#171222 80%);padding:max(16px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.now-expanded{overflow:hidden}.now-expanded .shell,.now-expanded .player{display:none}.now-expanded .full-player{display:flex;flex-direction:column}
.full-top{display:flex;justify-content:space-between;align-items:center;gap:12px;width:min(100%,1050px);margin:0 auto}.full-top strong{font-size:12px;letter-spacing:2px;color:#ead7ff}.full-top button,.full-tools button{background:#ffffff12;border-color:#ffffff30}
.full-content{width:min(100%,1050px);margin:auto;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:clamp(14px,3vh,30px);padding:20px 0}
.full-art{width:min(100%,420px,42vh);margin:auto;aspect-ratio:1}.full-art .art{width:100%;height:100%;border-radius:24px;box-shadow:0 20px 55px #0007;font-size:90px}
.full-info{min-width:0;display:grid;gap:16px}.full-info h1{font-size:clamp(23px,4vw,38px);line-height:1.15;overflow-wrap:anywhere}.full-info p{color:#e0c7ef}.full-timeline{display:grid;gap:4px}.full-timeline input{height:30px;cursor:pointer}.full-times{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;color:#e0c7ef;font-size:13px}
.full-controls{display:flex;align-items:center;justify-content:center;gap:clamp(16px,5vw,42px)}.full-controls button{min-width:72px;min-height:58px;font-size:22px;font-weight:700;background:#ffffff13;border-color:#ffffff30}.full-controls .full-play{width:78px;height:78px;min-width:78px;border-radius:50%;background:#f2d8ff;color:#2a143d;font-size:32px;border:0}
.full-tools{display:flex;justify-content:center;flex-wrap:wrap;gap:8px}.full-tools button{min-height:44px;font-size:14px;padding:10px 12px}.full-status{min-height:18px;color:#efceff;text-align:center;font-size:13px}.now[role=button]{cursor:pointer}.now[role=button]:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media(min-width:800px){.full-content{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,90px)}.full-art{width:min(100%,500px,65vh)}}
@media(max-height:470px) and (orientation:landscape){.full-content{grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:24px;padding:8px 0}.full-art{width:min(100%,62vh)}.full-info{gap:8px}.full-controls .full-play{width:56px;height:56px;min-width:56px;font-size:24px}.full-controls button{min-height:44px}.full-tools button{min-height:36px;padding:5px 9px}}

/* Keep episode metadata independent of the width of its action buttons. */
.episode{display:grid;grid-template-columns:52px minmax(0,1fr);align-items:start;column-gap:12px;row-gap:10px;min-width:0}
.episode>.art{grid-column:1;grid-row:1;width:52px;height:52px}
.episode>.info{grid-column:2;grid-row:1;min-width:0;width:100%}
.episode h3{word-break:normal;overflow-wrap:break-word;white-space:normal;line-height:1.4}
.episode .info small{display:block;line-height:1.5;overflow-wrap:break-word;margin-top:4px}
.episode>.actions{grid-column:2;grid-row:2;margin-left:0;min-width:0;max-width:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.episode>.actions button{flex:0 0 auto;max-width:100%;white-space:normal;overflow-wrap:break-word}
.episode:not(:has(>.art))>.info{grid-column:1/-1}
.episode:not(:has(>.art))>button{grid-column:auto;grid-row:auto}
@media(max-width:700px){.episode{padding:16px 0}.episode>.actions{grid-column:1/-1;justify-content:flex-start}.episode>.actions button{min-height:40px}.episode h3{font-size:16px}}

html{overscroll-behavior-y:contain}
#pullIndicator{position:fixed;z-index:12;top:max(8px,env(safe-area-inset-top));left:50%;transform:translate(-50%,0);padding:10px 18px;border:1px solid #7e589d;background:#332247;color:#f1daff;border-radius:24px;box-shadow:0 4px 18px #0006;font-size:14px;white-space:nowrap;pointer-events:none}
#pullIndicator[hidden]{display:none}

/* A single menu column cannot compete with episode text for width. */
.episode.compact-episode{display:grid!important;grid-template-columns:52px minmax(0,1fr) 44px!important;grid-template-rows:auto;align-items:start;gap:12px;width:100%;min-width:0;padding:16px 0}
.episode.compact-episode>.art{grid-area:1/1;width:52px;height:52px}
.episode.compact-episode>.info{grid-area:1/2;display:block;width:100%;min-width:0;max-width:100%;word-break:normal}
.episode.compact-episode h3{white-space:normal;word-break:normal;overflow-wrap:break-word;line-height:1.4}
.episode.compact-episode>.episode-more{grid-area:1/3;align-self:start;justify-self:end;width:44px;height:44px;padding:0;font-size:25px;line-height:1;border-radius:12px}
.episode-options button{text-align:left;min-height:44px}
@media(max-width:350px){.episode.compact-episode{grid-template-columns:44px minmax(0,1fr) 44px!important;gap:8px}.episode.compact-episode>.art{width:44px;height:44px}}
.transcript{position:relative}.transcript .tx-active{background:#54346c;border-color:#c69aff;color:white}.transcript .chapter{line-height:1.6}.transcript .chapter small{display:block;color:#d9b3ff}.transcript .chapter{min-height:44px}
.full-tools{align-items:center}.full-tools .full-transcript{background:#bd8cff;color:#1a102b;flex:1;max-width:260px;font-weight:750}.full-tools .full-more{width:52px;font-size:26px;line-height:1}.full-player{box-sizing:border-box}
</style></head><body><div id="pullIndicator" role="status" aria-live="polite" hidden></div><div class="shell"><aside class="sidebar"><div class="brand">◉ Pod<b>Flow</b></div><small>Listen your way.</small><nav class="nav" id="nav"></nav><div class="notice">Your library stays on this device. Export a backup to move it.</div></aside><main class="main"><div class="toolbar" style="margin-top:0"><span class="pill">PODFLOW • WEB EDITION</span><span style="flex:1"></span><button class="small mobilequeue" onclick="showQueue()">Queue</button><button class="small" onclick="drive(true)">Driving mode</button></div><div id="status" class="status" role="status"></div><div id="view"></div></main><aside class="right"><h2>Up next</h2><p class="muted">Your listening lineup</p><div id="queue"></div></aside></div><div class="drive"><h1>Driving mode</h1><h2 id="driveTitle">Nothing playing</h2><div class="controls"><button onclick="skip(-1)">↶ Back</button><button class="primary" onclick="togglePlay()" id="drivePlay">Play</button><button onclick="skip(1)">Forward ↷</button></div><button onclick="bookmark()">☆ Bookmark</button><button onclick="drive(false)">Exit driving mode</button></div><footer class="player"><div class="now" id="now" role="button" tabindex="0" aria-label="Expand now playing" onclick="expandPlayer(true)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();expandPlayer(true)}"></div><div class="middle"><div class="controls"><button class="small" onclick="skip(-1)" id="back">↶ 15</button><button class="primary play" onclick="togglePlay()" id="play">▶</button><button class="small" onclick="skip(1)" id="forward">30 ↷</button><button class="small" onclick="openDetails()">Notes</button></div><div class="timeline"><span id="elapsed">0:00</span><input id="seek" aria-label="Playback position" type="range" min="0" max="100" value="0" step="0.1"><span id="duration">0:00</span></div></div><div class="extras actions"><button class="small" onclick="speedDialog()" id="rate">1.00×</button><button class="small" onclick="sleepDialog()">◷ Sleep</button><button class="small" onclick="bookmark()">☆</button></div></footer><section id="fullPlayer" class="full-player" aria-label="Now playing" aria-hidden="true"><header class="full-top"><button onclick="expandPlayer(false)" id="fullCollapse" aria-label="Minimize player">⌄ Minimize</button><strong>NOW PLAYING</strong><button onclick="showQueue()" aria-label="Up next queue">☷ Queue</button></header><div class="full-content"><div id="fullArt" class="full-art"></div><div class="full-info"><div><h1 id="fullTitle">Nothing playing</h1><p id="fullShow">PodFlow</p><small id="fullOffline"></small></div><div class="full-timeline"><input id="fullSeek" type="range" aria-label="Playback position" min="0" max="100" step="0.1" value="0"><div class="full-times"><span id="fullElapsed">0:00</span><span id="fullRemaining">−0:00</span></div></div><div class="full-controls"><button id="fullBack" onclick="skip(-1)" aria-label="Skip backward">↶ 15</button><button id="fullPlay" class="full-play" onclick="togglePlay()" aria-label="Play">▶</button><button id="fullForward" onclick="skip(1)" aria-label="Skip forward">30 ↷</button></div><div class="full-tools"><button class="primary full-transcript" onclick="openTranscript()">▤ Transcription</button><button class="full-more" onclick="fullPlayerMoreMenu()" aria-label="More playback options" aria-haspopup="dialog">⋯</button></div><div id="fullStatus" class="full-status" role="status"></div></div></div></section><audio id="audio" preload="metadata"></audio><dialog id="modal"></dialog><input type="file" id="file" hidden><script src="app.js?v=14"></script></body></html>
